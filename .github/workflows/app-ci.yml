name: App CI/CD

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - 'k8s/**'
      - '.github/workflows/app-ci.yml'

permissions:
  contents: read

env:
  ECR_REPOSITORY: movies-py-api

jobs:
  build:
    name: Lint, build, scan, push
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Derive the image tag from the commit
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >>"$GITHUB_ENV"
          echo "Image tag: ${GITHUB_SHA::7}"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff format --check
        working-directory: api
        run: uv run ruff format --check app scripts

      - name: ruff check
        working-directory: api
        run: uv run ruff check app scripts

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          remote="${REGISTRY}/${ECR_REPOSITORY}"
          docker tag "${ECR_REPOSITORY}:${IMAGE_TAG}" "${remote}:${IMAGE_TAG}"
          docker push "${remote}:${IMAGE_TAG}"

  deploy:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: k8s-deploy-staging
      cancel-in-progress: false
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APP_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.33.0

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ vars.EKS_CLUSTER_NAME }}" \
            --region "${{ vars.AWS_REGION }}"

      - name: Render manifests
        run: |
          export IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA::7}"
          yq -i '(.. | select(. == "<IMAGE>")) = strenv(IMAGE)' k8s/movies-api.yaml

      - name: Deploy NGINX
        run: |
            kubectl apply -f k8s/nginx.yaml
            kubectl rollout status deployment/nginx --timeout=5m

      - name: Deploy movies-api
        run: |
            kubectl apply -f k8s/movies-api.yaml
            kubectl rollout status deployment/movies-api --timeout=5m
