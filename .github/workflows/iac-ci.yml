# Orchestration only. The work lives in:
#   .github/scripts/affected-envs.sh    which envs a change affects
#   .github/actions/tf-setup/           terraform + tflint + OIDC preamble
#   .github/workflows/tf-plan.yml       lint/validate/plan one env
#   .github/workflows/tf-cost.yml       infracost diff for one env
name: IaC CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment root under infra/envs/ to plan and apply
        type: choice
        default: staging
        options:
          - staging
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  changes:
    name: Detect affected environments
    runs-on: ubuntu-latest
    outputs:
      envs: ${{ steps.detect.outputs.envs }}
      any: ${{ steps.detect.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: .github/scripts/affected-envs.sh
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          DISPATCH_ENV: ${{ inputs.environment }}

  checks:
    name: Format & scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup

      - name: terraform fmt
        run: terraform -chdir=infra fmt -check -diff -recursive

      # skip-dirs: init vendors third-party modules into .terraform/
      - name: Trivy IaC scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '0'
          skip-dirs: '**/.terraform'

  plan:
    name: Plan
    needs: [changes, checks]
    if: needs.changes.outputs.any == 'true'
    strategy:
      # One env's failure shouldn't hide another env's plan.
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.changes.outputs.envs) }}
    uses: ./.github/workflows/tf-plan.yml
    with:
      environment: ${{ matrix.env }}
      # Only a dispatch leads to an apply, so only it needs the artifact.
      upload-plan: ${{ github.event_name == 'workflow_dispatch' }}

  cost:
    name: Cost diff
    needs: changes
    if: >-
      needs.changes.outputs.any == 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.changes.outputs.envs) }}
    uses: ./.github/workflows/tf-cost.yml
    with:
      environment: ${{ matrix.env }}
    secrets:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

  apply:
    name: Apply ${{ inputs.environment }} (requires approval)
    runs-on: ubuntu-latest
    needs: [plan]
    # Manual trigger only — merging never deploys.
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}-apply
    concurrency:
      group: terraform-apply-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_ROOT: infra/envs/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/tf-setup
        with:
          aws-role-arn: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download the approved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.TF_ROOT }}

      - name: terraform init
        run: terraform -chdir=${TF_ROOT} init -input=false

      - name: terraform apply
        run: terraform -chdir=${TF_ROOT} apply -input=false tfplan
